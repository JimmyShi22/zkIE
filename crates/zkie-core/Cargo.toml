[package]
name = "zkie-core"
version = "0.1.0"
edition = "2021"
description = "zkIE proving substrate: reductions + WHIR/FRI PCS (CPU + optional CUDA)"
license = "Apache-2.0"

[dependencies]
p3-challenger = "0.7.0"
p3-commit = "0.7.0"
p3-dft = { version = "0.7.0", features = ["parallel"] }
p3-field = "0.7.0"
p3-goldilocks = "0.7.0"
p3-matrix = "0.7.0"
p3-maybe-rayon = { version = "0.7.0", features = ["parallel"] }
rayon = "1.10"
memmap2 = "0.9"
p3-merkle-tree = "0.7.0"
p3-multilinear-util = "0.7.0"
p3-poseidon2 = "0.7.0"
p3-sumcheck = "0.7.0"
p3-symmetric = "0.7.0"
p3-util = "0.7.0"
p3-whir = "0.7.0"
rand = "0.10.1"
sppark = { version = "=0.1.15", optional = true }

[build-dependencies]
which = "4"

[dev-dependencies]
p3-util = "0.7.0"

[features]
default = []
cuda = ["dep:sppark"]
