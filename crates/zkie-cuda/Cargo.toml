[package]
name = "zkie-cuda"
version = "0.1.0"
edition = "2021"
description = "CUDA acceleration for the zkIE GKR/WHIR prover: Sppark Goldilocks NTT + GPU Poseidon2 Merkle commitments"
license = "MIT OR Apache-2.0"

[dependencies]
p3-commit = "0.7.0"
p3-dft = "0.7.0"
p3-field = "0.7.0"
p3-goldilocks = "0.7.0"
p3-matrix = "0.7.0"
p3-merkle-tree = "0.7.0"
p3-poseidon2 = "0.7.0"
p3-symmetric = "0.7.0"
rand = "0.10.1"
sppark = { version = "=0.1.15", optional = true }

[build-dependencies]
which = "4"

[dev-dependencies]
p3-util = "0.7.0"

[features]
default = []
cuda = ["dep:sppark"]
